[project]
name = "mydev-toy"
version = "0.1.0"
description = "Toy PrivateUse1 backend (CMake + C++), loaded via torch.ops.load_library"
readme = "mydev/README.md"
requires-python = ">=3.9"
dependencies = [
  "torch",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
  "debugpy>=1.8.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch-cpu"

[[tool.uv.index]]
url = "https://pypi.org/simple"
name = "pypi"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
markupsafe = { index = "pypi" }
jinja2 = { index = "pypi" }


